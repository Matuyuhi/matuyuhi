name: Fetch SVG and Push

on:
  schedule: # execute every 24 hours
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  fetch_and_push_svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5.0.1

    - name: recreate SVG directory
      run: |
        rm -rf svg
        mkdir -p svg

    - name: Fetch SVG content
      run: |
        # GitHub Readme Stats
        curl -H 'Cache-Control: no-cache' -o svg/image.svg "https://github-readme-status-clone-01.vercel.app/api?username=matuyuhi&show=reviews,prs_merged,prs_merged_percentage&hide=stars&show_icons=true&title_color=fff&icon_color=79ff97&text_color=9f9f9f&bg_color=151515&include_all_commits=true"

        # GitHub Profile Trophy
        # curl -H 'Cache-Control: no-cache' -o svg/trophy.svg "https://github-profile-trophy-kannan.vercel.app?username=Matuyuhi&count_private=true&no-frame=true&column=5&rank=-B"
    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.x

    - name: Clone trophy generator
      run: |
        git clone https://github.com/Erik-Donath/github-profile-trophy.git .trophy-gen
        git -C .trophy-gen checkout e3c89df995e92e67cdd4b2acaab9d974583dc1f7

    - name: Generate trophy SVG
      env:
        GITHUB_TOKEN1: ${{ secrets.SUMMARY_CARDS_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
      run: |
        deno run --allow-net --allow-env --allow-read --allow-write \
          scripts/render_trophy.ts \
          Matuyuhi \
          --file svg/trophy.svg \
          --theme default \
          --no-frame \
          --cols 5 \
          --rows 10 \
          --panel-size 115 \
          --margin-width 10 \
          --margin-height 10

    - name: Verify trophy SVG is not empty
      run: |
        set -e
        test -s svg/trophy.svg || { echo "::error::svg/trophy.svg is empty"; exit 1; }
        dims=$(head -c 400 svg/trophy.svg | tr -d '\n' | grep -oE 'width="[0-9-]+"[[:space:]]*height="[0-9-]+"' | head -1)
        echo "root dimensions: $dims"
        case "$dims" in
          *'width="0"'*|*'height="0"'*|"")
            echo "::error::svg/trophy.svg rendered with zero/unreadable dimensions ($dims)"
            exit 1
            ;;
        esac

    - name: Commit and Push if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add svg/image.svg svg/trophy.svg
        git diff --staged --quiet || (git commit -m "Add/Update image.svg and trophy.svg from URL" && git push)
